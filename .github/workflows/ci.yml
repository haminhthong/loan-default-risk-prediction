name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall src app scripts
      - run: docker build -t loan-default-risk:test .
      - run: |
          docker run -d --name loan-api -p 8000:8000 loan-default-risk:test
          sleep 3
          curl -f http://localhost:8000/health || exit 1
